name: Soạn nháp bài phân tích (Bến Hàng Hóa)

# Tự chạy 08:17 sáng giờ VN mỗi ngày (01:17 UTC), thêm lượt dự phòng 08:47
# (01:47 UTC) phòng khi GitHub bỏ lỡ lượt đầu + cho phép bấm chạy tay.
# ⚠️ Tránh phút :00 — GitHub free tier hay bỏ lịch đầu giờ (giống bot tin tức).
# Bản nháp được lưu vào thư mục drafts/ — KHÔNG nằm trong src/content nên
# KHÔNG tự lên web. Bạn mở ra duyệt, sửa mốc giá, rồi mới đăng.
# Mỗi lượt chạy tự dọn bản nháp cũ hơn 14 ngày để thư mục không phình mãi.
on:
  schedule:
    - cron: "17 1 * * *"   # 01:17 UTC = 08:17 sáng VN
    - cron: "47 1 * * *"   # 01:47 UTC = 08:47 sáng VN — dự phòng nếu lần đầu bị GitHub bỏ lỡ
  workflow_dispatch:
    inputs:
      chu_de:
        description: "Chủ đề / mặt hàng (vd: vàng, dầu WTI, cà phê). Để TRỐNG = tự chọn tin nóng nhất."
        required: false
        default: ""
      trong_tam:
        description: "Trọng tâm muốn nhấn (vd: tác động của Fed, rủi ro nguồn cung). Để TRỐNG = phân tích chung."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `continue-on-error` KHÔNG phải để nuốt lỗi — hai bước cuối vẫn bắt lượt
      # chạy đỏ. Nó chỉ để việc dọn nháp cũ hơn 14 ngày vẫn chạy dù khâu soạn bài
      # hỏng, kẻo thư mục drafts/ phình mãi mỗi khi AI trục trặc.
      - name: Soạn nháp bằng AI miễn phí (Gemini + Groq + DeepSeek)
        id: soan-nhap
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOPIC: ${{ github.event.inputs.chu_de }}
          FOCUS: ${{ github.event.inputs.trong_tam }}
        run: node scripts/draft-article.mjs

      - name: Dọn bản nháp cũ hơn 14 ngày
        run: |
          # Tên tập tin nháp luôn mở đầu bằng ngày, ví dụ: 2026-06-19-vang-....gemini.md
          # Lấy ngày ngay trong tên tập tin (đáng tin hơn ngày sửa tập tin, vì mỗi lần
          # máy chủ tải mã nguồn về thì ngày sửa đều bị đặt lại thành hôm nay).
          moc=$(date -u -d "14 days ago" +%Y-%m-%d)
          echo "Xoá bản nháp có ngày trước $moc"
          dem=0
          for f in drafts/*.md drafts/*.fanpage.txt; do
            [ -e "$f" ] || continue
            ten=$(basename "$f")
            [ "$ten" = "README.md" ] && continue
            ngay=${ten:0:10}
            # Bỏ qua tập tin không mở đầu bằng ngày đúng dạng NĂM-THÁNG-NGÀY
            case "$ngay" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
              *) continue ;;
            esac
            if [[ "$ngay" < "$moc" ]]; then
              rm -f "$f"
              dem=$((dem+1))
            fi
          done
          echo "Đã xoá $dem tập tin nháp cũ."

      - name: Commit bản nháp nếu có thay đổi
        run: |
          git config user.name  "benhanghoa-bot"
          git config user.email "bot@benhanghoa.local"
          git add -A drafts   # -A để ghi nhận cả tập tin bị xoá ở bước dọn
          if git diff --staged --quiet; then
            echo "Không có bản nháp mới."
            exit 0
          fi
          git commit -m "chore: nháp bài phân tích tự động (AI free)"
          # Lượt 08:17 và lượt dự phòng 08:47 có thể trùng nhau, hoặc đụng bot tin
          # tức đang đẩy. Thử lại thay vì báo đỏ oan — xem ghi chú trong fetch-prices.yml.
          for lan in 1 2 3 4 5; do
            if git push; then
              echo "Đã lưu phiên bản và đẩy lên (lần thử $lan)."
              exit 0
            fi
            echo "Đẩy hỏng ở lần thử $lan — kéo bản mới nhất về rồi thử lại."
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            sleep $((lan * 5))
          done
          echo "::error::Đẩy bản nháp lên kho thất bại sau 5 lần thử — không phải lỗi khâu soạn bài, mà lỗi khâu lưu."
          exit 1

      # Hỏng thì phải KÊU — nhưng đừng kêu oan. Lượt 08:17 hỏng thì vẫn còn lượt
      # dự phòng 08:47 cứu, nên lượt đầu chỉ ghi cảnh báo vàng. Chỉ khi lượt dự
      # phòng (hoặc lượt bấm chạy tay) vẫn không ra bài mới báo đỏ để GitHub gửi thư.
      - name: Ghi chú nếu lượt đầu chưa soạn được nháp
        if: steps.soan-nhap.outcome == 'failure' && github.event.schedule == '17 1 * * *'
        run: echo "::warning::Lượt 08:17 chưa soạn được bản nháp nào — chờ lượt dự phòng 08:47."

      - name: Báo đỏ nếu vẫn không soạn được nháp
        if: steps.soan-nhap.outcome == 'failure' && github.event.schedule != '17 1 * * *'
        run: |
          echo "::error::Không soạn được bản nháp nào — mở nhật ký bước 'Soạn nháp bằng AI miễn phí' xem lý do từng nhà cung cấp."
          exit 1
