# ============================================================
# Decap CMS — cấu hình bộ biên tập nội dung cho Bến Hàng Hóa
# Biên tập viên đăng tin/bài qua giao diện web, không cần code.
#
# Xác thực: dùng GitHub OAuth qua Cloudflare Pages Functions (/api/auth, /api/callback).
# Cần tạo GitHub OAuth App + đặt biến môi trường GITHUB_OAUTH_CLIENT_ID/SECRET
# trên Cloudflare Pages (xem hướng dẫn).
# ============================================================

backend:
  name: github
  repo: zz761311-byte/benhanghoa
  branch: main
  base_url: https://benhanghoa.pages.dev
  auth_endpoint: /api/auth

# Cho phép xem thử/biên tập tại máy khi chạy: npx decap-server
local_backend: true

media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"

locale: "vi"

collections:
  # ── BẢN NHÁP AI ─────────────────────────────────────────────────────────
  # Bot soạn nháp ghi bài vào thư mục `drafts/` mỗi sáng. Thư mục đó KHÔNG nằm
  # trong `src/content/` nên không có gì lên web — muốn đăng thì phải tự chép
  # sang mục "Tin tức / Bài viết" bên dưới.
  #
  # Vì sao đưa vào đây: trước ngày 02/09/2026 chủ web phải vào GitHub mở từng
  # tập tin để copy, rất mất thời gian. Nay đọc và sửa ngay trong trang này.
  #
  # `create: false` — chỉ bot mới tạo nháp, người không tạo tay ở đây.
  - name: "nhap"
    label: "Bản nháp AI (chưa lên web)"
    label_singular: "Bản nháp"
    description: >-
      Bài do AI soạn mỗi sáng, CHƯA đăng. Đọc lại, điền mốc giá thật, rồi chép
      sang mục "Tin tức / Bài viết" để đăng. Caption Fanpage nằm ở ô riêng phía
      dưới. Bản nháp cũ hơn 14 ngày tự bị xoá.
    folder: "drafts"
    create: false
    delete: true
    extension: "md"
    # Dòng hiện trong danh sách: NGÀY GIỜ soạn trước, rồi AI nào viết, rồi tiêu đề
    # — liếc qua là biết bài nào mới, bài nào để lâu rồi.
    summary: "{{date | date('DD/MM HH:mm')}} · {{ai}} · {{title}}"
    # 🔴 CHỈ ĐƯỢC VIẾT DẠNG MẢNG. Decap 3.3 bắt buộc `sortable_fields` là mảng —
    # viết dạng nhiều tầng (fields/default) là cả trang quản trị chết với thông
    # báo "must be array", không vào được. Đã mắc ngày 02/09/2026.
    # Vì vậy KHÔNG đặt được thứ tự mặc định trong tập tin này: muốn bài mới lên
    # đầu thì bấm nút "Sort by" trong giao diện một lần, trình duyệt nhớ luôn.
    sortable_fields: ["date", "title", "ai"]
    fields:
      - { label: "Tiêu đề", name: "title", widget: "string" }
      - { label: "Soạn lúc (giờ Việt Nam)", name: "date", widget: "datetime", date_format: "DD/MM/YYYY", time_format: "HH:mm" }
      - { label: "AI nào viết", name: "ai", widget: "string", required: false }
      - label: "Nhóm hàng hóa"
        name: "category"
        widget: "select"
        default: "macro"
        options:
          - { label: "Kim loại", value: "metal" }
          - { label: "Năng lượng", value: "energy" }
          - { label: "Nông sản", value: "agri" }
          - { label: "Nguyên liệu", value: "soft" }
          - { label: "Vĩ mô", value: "macro" }
      - { label: "Ảnh đại diện", name: "image", widget: "image", required: false }
      - { label: "Tóm tắt ngắn", name: "summary", widget: "text", required: false }
      # 4 caption để đăng Fanpage. Để riêng một ô, KHÔNG lẫn vào nội dung bài,
      # nên copy sang Facebook không sợ dán nhầm cả bài lên web.
      - { label: "💬 Caption Fanpage — copy sang Facebook, ĐỪNG dán vào bài", name: "captions", widget: "text", required: false }
      - { label: "Nội dung bài", name: "body", widget: "markdown" }

  # ── BÀI ĐÃ ĐĂNG (lên web thật) ──────────────────────────────────────────
  - name: "tin"
    label: "Tin tức / Bài viết"
    label_singular: "Bài viết"
    folder: "src/content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    # Ngày đăng đứng trước tiêu đề, và bài mới nhất lên đầu — giống mục bản nháp
    summary: "{{date | date('DD/MM/YYYY')}} · {{title}}"
    sortable_fields: ["date", "title"]   # phải là mảng — xem ghi chú ở mục trên
    fields:
      - { label: "Tiêu đề", name: "title", widget: "string" }
      - { label: "Ngày đăng", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - label: "Nhóm hàng hóa"
        name: "category"
        widget: "select"
        default: "macro"
        options:
          - { label: "Kim loại", value: "metal" }
          - { label: "Năng lượng", value: "energy" }
          - { label: "Nông sản", value: "agri" }
          - { label: "Nguyên liệu", value: "soft" }
          - { label: "Vĩ mô", value: "macro" }
      - { label: "Ảnh đại diện", name: "image", widget: "image", required: false }
      - { label: "Tóm tắt ngắn", name: "summary", widget: "text", required: false }
      - { label: "Nội dung", name: "body", widget: "markdown" }
